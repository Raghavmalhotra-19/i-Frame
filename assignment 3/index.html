<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
       
    
    <style>
        *{
            padding: 0%;
            margin: 0%;
            box-sizing: border-box;
            text-align: center;

        }
        
        .container{
            height: 600px;
            border: 1px solid black;
            color: wheat;
        }
        .header,.footer{
            height: 20%;
            background-color: pink;

        }
        .center{
            height: 60%;
            background-color: brown;
            display: flex;


        }
        .left{
            height: 100%;
            width: 30%;
            background-color: coral;

        }
        .right{
            height: 100%;
            width: 70%;
            background-color: yellow;
        }
        .top{
            height: 50%;
            background-color: darkgray;
        }
        .bottom{
            height: 50%;
            background-color: darkblue;
            display: flex;

        }
        .r1{
            height: 100%;
            width: 50%;
            background-color: cadetblue;

        }
        .r2{
            height: 100%;
            width: 50%;
            background-color: cornflowerblue;

        }
      
        
    </style>
</head>
<body>
    <h1>Flexbox</h1>
<div class="container">
    <div class="header"><h1>header</h1></div>
    <div class="center">
    <div class="left"><h1>left</h1></div>
    <div class="right">
    <div class="top"><h1>top</h1></div>
    <div class="bottom">
    <div class="r1"><h1>r1</h1></div>
    <div class="r2"><h1>r2</h1></div>
</div>
</div>
</div>
<div class="footer"><h1>footer</h1></div>
</div>
</body>
</html>
